name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: faouzielbakri/portfolio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL secret not set — skipping redeploy trigger."
            echo "Dokploy will pick up the new image on its next pull schedule, or trigger manually."
            exit 0
          fi
          # Send a GitHub-shaped push payload so Dokploy labels the
          # deployment with the commit message instead of "Manual deployment".
          # Dokploy parses head_commit.message and head_commit.id when the
          # X-GitHub-Event header is present.
          COMMIT_MSG=$(git log -1 --pretty=%B)
          PAYLOAD=$(jq -n \
            --arg id "$GITHUB_SHA" \
            --arg msg "$COMMIT_MSG" \
            --arg ref "$GITHUB_REF" \
            --arg author "$GITHUB_ACTOR" \
            '{ref: $ref, head_commit: {id: $id, message: $msg, author: {name: $author}}}')
          echo "Pinging Dokploy to redeploy..."
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD"
          echo ""
